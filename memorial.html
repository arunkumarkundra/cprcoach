<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prisha Kundra — In loving memory</title>
<meta name="description" content="CPR Coach was created in loving memory of Prisha Kundra, 2008–2024.">
<meta name="robots" content="index,follow">

<!-- Shown when the page is shared on WhatsApp, Messages or social media.
     If you want the photograph to appear in that preview, replace the two
     image URLs below with the full address, for example:
     https://YOURNAME.github.io/images/Prisha_Kundra.png -->
<meta property="og:type" content="website">
<meta property="og:title" content="Prisha Kundra — In loving memory">
<meta property="og:description" content="She never hesitated to help anyone. This project is a small attempt to help someone else when they need it.">
<meta property="og:image" content="images/Prisha_Kundra.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="images/Prisha_Kundra.png">

<style>
/* This page is deliberately self-contained. It shares no file with the app,
   so nothing here can affect how the app loads or behaves. The colours and
   type are copied from index.html rather than imported, for the same reason. */
:root{
  --paper:#FAFAF7;
  --ink:#0F1113;
  --slate:#5A646E;
  --hair:#D9DCD8;
  --pulse:#E8412C;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  padding:0 clamp(20px,6vw,32px);
}

/* A quiet way back. Small, out of the way, but always present — nobody
   should have to hunt for the back button to return to the app. */
.back{
  padding:calc(18px + env(safe-area-inset-top)) 0 0;
}
.back a{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:var(--slate);
  font-size:13px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  text-decoration:none;
  padding:8px 2px;
}
.back a:hover{color:var(--ink)}
.back svg{width:19px;height:19px;flex:none}

main{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  width:100%;
  max-width:480px;
  margin:0 auto;
  padding:clamp(28px,7vh,56px) 0;
}

/* A photograph in a mat, the way one sits on a shelf — a white border and
   a soft shadow, rather than the flat rounded rectangle of an app avatar. */
.frame{
  width:min(300px,70vw);
  padding:12px;
  background:#fff;
  border:1px solid rgba(0,0,0,.07);
  border-radius:10px;
  box-shadow:0 14px 40px rgba(0,0,0,.16);
}
.frame img{
  display:block;
  width:100%;
  height:auto;
  border-radius:3px;
}

.name{
  margin-top:clamp(26px,5vh,38px);
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(30px,8vw,40px);
  font-weight:400;
  letter-spacing:.005em;
  line-height:1.15;
}
.dates{
  margin-top:12px;
  font-size:14px;
  font-weight:700;
  letter-spacing:.18em;
  color:var(--slate);
  font-variant-numeric:tabular-nums;
}

.rule{
  width:46px;
  height:2px;
  border-radius:2px;
  background:var(--pulse);
  opacity:.85;
  margin:clamp(26px,5vh,36px) 0;
}

.lines{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(17px,4.6vw,20px);
  line-height:1.72;
  max-width:32em;
}
.lines p{margin:0 0 14px}
.lines p:last-child{
  margin-bottom:0;
  color:var(--slate);
}

footer{
  padding:20px 0 calc(22px + env(safe-area-inset-bottom));
  text-align:center;
  font-size:12px;
  font-weight:600;
  line-height:1.6;
  color:var(--slate);
  border-top:1px solid var(--hair);
}
footer a{color:var(--slate);text-decoration:underline;text-underline-offset:3px}

@media (max-height:520px) and (orientation:landscape){
  .frame{width:min(190px,32vw)}
  main{padding:20px 0}
  .rule{margin:20px 0}
}
</style>
</head>
<body>

<div class="back">
  <a href="index.html">
    <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M4 36h10l6-20 8 32 6-16h26" fill="none" stroke="#E8412C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    CPR Coach
  </a>
</div>

<main>
  <div class="frame">
    <img src="images/Prisha_Kundra.png" alt="Prisha Kundra" width="948" height="1078">
  </div>

  <h1 class="name">Prisha Kundra</h1>
  <p class="dates">2008 &ndash; 2024</p>

  <div class="rule" role="presentation"></div>

  <div class="lines">
    <p>She never hesitated to help anyone.</p>
    <p>We couldn&rsquo;t help her when she needed it most.</p>
    <p>This project is a small attempt to help someone when they need it most.</p>
  </div>
</main>

<footer>
  <a href="index.html">Return to CPR Coach</a>
</footer>

</body>
</html>
